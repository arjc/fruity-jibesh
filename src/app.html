<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Basic Page Needs -->
		<title>Fruity Jibesh 🍉</title>
		<meta
			name="description"
			content="Play Fruity Jibesh offline: drop and merge fruit in this physics puzzle." />
		<meta
			name="keywords"
			content="fruity jibesh, suika game, watermelon game, fruit merging game, physics puzzle, puzzle game, high score game, casual game, web game, merge game, fruit game" />
		<meta name="author" content="Timothy Kempf" />
		<!-- Replace with your name or studio -->
		<meta name="robots" content="index, follow" />

		<!-- Canonical URL -->
		<link rel="canonical" href="https://subak.kempf.dev/" />
		<!-- Replace with your game's main URL -->

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="game" />
		<meta property="og:url" content="https://subak.kempf.dev/" />
		<!-- Replace with your game's main URL -->
		<meta property="og:title" content="Fruity Jibesh 🍉" />
		<meta
			property="og:description"
			content="Play Fruity Jibesh offline: drop and merge fruit in this physics puzzle." />
		<meta property="og:image" content="%sveltekit.assets%/opengraph.png" />
		<!-- Replace with URL to an appealing image (1200x630px recommended) -->
		<meta
			property="og:image:alt"
			content="Gameplay screenshot of Fruity Jibesh showing various fruits merging." />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:site_name" content="Fruity Jibesh 🍉" />
		<meta property="og:locale" content="en_US" />
		<!-- Adjust if your primary language isn't English -->

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://subak.kempf.dev/" />
		<!-- Replace with your game's main URL -->
		<meta name="twitter:title" content="Fruity Jibesh 🍉" />
		<meta
			name="twitter:description"
			content="Play Fruity Jibesh offline: drop and merge fruit in this physics puzzle." />
		<meta name="twitter:image" content="%sveltekit.assets%/opengraph.png" />
		<meta name="twitter:image:alt" content="Fruity Jibesh 🍉 logo with colorful fruits." />

		<!-- Theme Color for Browsers -->
		<meta name="theme-color" content="#3b1c6e" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />

		<!-- PWA manifest -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

		<!-- iOS: manifest install is not supported; these drive Add to Home Screen -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Fruity Jibesh" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />

		<!-- Fonts -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div>%sveltekit.body%</div>
	</body>
</html>
